# Alternativa si alojas la web en GitHub (GitHub Pages, Vercel o Netlify conectados al repo).
# Guarda tu clave en Settings > Secrets > Actions con el nombre ANTHROPIC_API_KEY.
name: Actualizar Chispa
on:
  schedule: [{ cron: "0 5 * * *" }]   # todos los días a las 05:00 UTC (7:00 en España en verano)
  workflow_dispatch: {}
permissions: { contents: write }
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install feedparser requests
      - run: python scripts/update_feed.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SITE_DIR: .
      - run: |
          git config user.name "chispa-bot"; git config user.email "bot@users.noreply.github.com"
          git add feeds && git commit -m "Feed $(date +%F)" && git push || echo "Sin cambios"
