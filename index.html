<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chispa: noticias que merecen un minuto</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#ECEAE4; --chrome:rgba(236,234,228,.86); --ink:#16161A; --muted:#5E5E66; --line:rgba(22,22,26,.12);
  --paper:#FFF7EA; --chip:#FFFFFF;
  --ciencia:#1D3BC2; --historia:#8A2432; --economia:#0E5E47; --medicina:#C9432A;
  --ia:#4B24B8; --tecnologia:#0B6F7E; --nutricion:#E8B321;
  --display:"Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --serif:"Source Serif 4", Georgia, "Times New Roman", serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#141418; --chrome:rgba(20,20,24,.86); --ink:#F2F0EA; --muted:#A3A3AD; --line:rgba(242,240,234,.14); --chip:#23232A; }
}
:root[data-theme="dark"]{ --bg:#141418; --chrome:rgba(20,20,24,.86); --ink:#F2F0EA; --muted:#A3A3AD; --line:rgba(242,240,234,.14); --chip:#23232A; }
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:var(--display);-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
a{color:inherit}
:focus-visible{outline:3px solid currentColor;outline-offset:2px}

.app{height:100%;max-width:560px;margin:0 auto;display:flex;flex-direction:column;position:relative}
header{flex:none;padding:10px 14px 6px;background:var(--chrome);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line);z-index:5}
.top{display:flex;align-items:center;gap:10px}
.brand{font-weight:800;font-size:22px;letter-spacing:-.02em;margin-right:auto;display:flex;align-items:baseline;gap:8px}
.brand small{font-weight:400;font-size:12px;color:var(--muted);letter-spacing:0;white-space:nowrap}
.tabs{display:flex;gap:4px;background:var(--chip);border:1px solid var(--line);border-radius:999px;padding:3px}
.tabs button{border:0;background:none;white-space:nowrap;padding:6px 10px;border-radius:999px;font-size:14px;font-weight:600;color:var(--muted)}
.tabs button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.sub{display:flex;align-items:center;gap:8px;margin-top:8px}
.sub select{font:inherit;font-size:13px;background:var(--chip);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:5px 8px}
.order{font-size:13px;border:1px solid var(--line);background:var(--chip);border-radius:8px;padding:5px 9px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:8px 0 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--chip);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:600;display:flex;align-items:center;gap:6px}
.chip i{width:9px;height:9px;border-radius:50%;display:inline-block}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

main{flex:1;min-height:0;position:relative}
.feed{height:100%;overflow-y:auto;scroll-snap-type:y mandatory;overscroll-behavior:contain;scrollbar-width:none}
.feed::-webkit-scrollbar{display:none}

.card{height:100%;scroll-snap-align:start;scroll-snap-stop:always;position:relative;color:var(--paper);background:var(--c);display:flex;overflow:hidden}
.card.light{color:#1C1606}
.card .body{flex:1;min-width:0;display:flex;flex-direction:column;padding:22px 72px 22px 22px;overflow-y:auto}
.meta{display:flex;align-items:center;gap:10px;font-size:13px;font-weight:600;opacity:.92}
.meta .cat{border:1.5px solid currentColor;border-radius:999px;padding:2px 10px}
.meta .src{opacity:.8;font-weight:400}
.meta .when{margin-left:auto;opacity:.7;font-weight:400}
.hook{margin-top:auto;padding-top:18px}
.hook b{display:block;font-weight:800;font-size:clamp(72px,23vw,140px);line-height:.86;letter-spacing:-.045em;font-variation-settings:"opsz" 96;word-break:break-word}
.hook span{display:block;font-size:15px;margin-top:8px;opacity:.85;max-width:28ch}
.card h2{font-weight:800;font-size:clamp(22px,5.6vw,30px);line-height:1.08;letter-spacing:-.02em;margin:18px 0 10px;max-width:22ch;text-wrap:balance}
.card.nohook h2{margin-top:auto;font-size:clamp(32px,8.6vw,48px);max-width:16ch}
.idea{font-family:var(--serif);font-size:17px;line-height:1.5;margin:0 0 12px;max-width:44ch}
.concl{font-family:var(--serif);font-weight:600;font-size:16px;line-height:1.45;margin:0 0 16px;padding-left:12px;border-left:3px solid currentColor;max-width:44ch}
.links{display:flex;flex-wrap:wrap;gap:8px}
.links a{font-size:14px;font-weight:600;text-decoration:none;border-radius:999px;padding:8px 14px;border:1.5px solid currentColor}
.links a.main{background:var(--paper);color:var(--c);border-color:var(--paper)}
.card.light .links a.main{background:#1C1606;color:var(--c);border-color:#1C1606}
.lang{font-size:11px;font-weight:600;opacity:.75;margin-left:4px}

.rail{position:absolute;right:10px;bottom:22px;display:flex;flex-direction:column;gap:14px;align-items:center}
.act{width:48px;height:48px;border-radius:50%;border:0;background:rgba(0,0,0,.22);display:grid;place-items:center;transition:transform .15s}
.card.light .act{background:rgba(0,0,0,.1)}
.act svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.act[aria-pressed="true"]{background:var(--paper);color:var(--c)}
.card.light .act[aria-pressed="true"]{background:#1C1606;color:var(--c)}
.act[aria-pressed="true"] svg.fillable{fill:currentColor}
.act:active{transform:scale(.9)}
.act-label{font-size:11px;text-align:center;margin-top:-10px;opacity:.85}

.burst{position:absolute;left:50%;top:45%;width:120px;height:120px;margin:-60px;pointer-events:none;opacity:0}
.burst svg{width:100%;height:100%;fill:var(--paper);stroke:none}
.burst.go{animation:burst .7s ease-out}
@keyframes burst{0%{opacity:0;transform:scale(.4)}25%{opacity:.95;transform:scale(1.1)}100%{opacity:0;transform:scale(1.4)}}
@media (prefers-reduced-motion: reduce){.burst.go{animation:none}.act{transition:none}.feed{scroll-behavior:auto}}

.counter{position:absolute;left:0;right:0;top:0;height:3px;background:rgba(255,255,255,.18);z-index:2}
.counter i{display:block;height:100%;background:var(--paper);width:0;transition:width .2s}

.panel{height:100%;overflow-y:auto;padding:18px 16px 40px}
.panel h3{font-size:24px;font-weight:800;letter-spacing:-.02em;margin:6px 0 4px}
.panel p.lead{color:var(--muted);font-size:15px;margin:0 0 18px;font-family:var(--serif)}
.saved{display:flex;flex-direction:column;gap:10px}
.saved article{display:grid;grid-template-columns:8px 1fr auto;gap:12px;background:var(--chip);border:1px solid var(--line);border-radius:12px;padding:12px}
.saved article>i{border-radius:4px;background:var(--c)}
.saved h4{margin:0 0 4px;font-size:16px;line-height:1.2}
.saved .s-meta{font-size:12px;color:var(--muted)}
.saved a{font-size:13px;font-weight:600}
.saved button{border:0;background:none;color:var(--muted);font-size:13px;align-self:start}
.bars{display:flex;flex-direction:column;gap:12px}
.bar{display:grid;grid-template-columns:96px 1fr 70px;align-items:center;gap:10px;font-size:14px}
.bar .track{height:14px;background:var(--line);border-radius:7px;overflow:hidden}
.bar .fill{height:100%;background:var(--c);border-radius:7px}
.bar .num{font-size:12px;color:var(--muted);text-align:right}
.stats{display:flex;gap:10px;margin:0 0 22px}
.stats div{flex:1;background:var(--chip);border:1px solid var(--line);border-radius:12px;padding:12px}
.stats b{display:block;font-size:28px;font-weight:800;letter-spacing:-.02em}
.stats span{font-size:12px;color:var(--muted)}
.empty{height:100%;display:flex;flex-direction:column;justify-content:center;padding:32px;gap:10px}
.empty h3{font-size:26px;margin:0;letter-spacing:-.02em}
.empty p{margin:0;color:var(--muted);font-family:var(--serif);font-size:16px;line-height:1.5}
.empty code{font-family:inherit;font-weight:600;color:var(--ink)}
.note{font-size:12px;color:var(--muted);margin-top:18px;font-family:var(--serif)}
.toast{position:absolute;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:999px;font-size:13px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s;z-index:9;white-space:nowrap}
.toast.show{opacity:1}
@media (max-width:370px){ .brand small{display:none} .tabs button{padding:6px 8px;font-size:13px} }
@media (min-width:600px){ .app{border-left:1px solid var(--line);border-right:1px solid var(--line)} }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="top">
      <div class="brand">Chispa <small id="dayLabel"></small></div>
      <div class="tabs" role="group" aria-label="Sección">
        <button data-view="feed" aria-pressed="true">Hoy</button>
        <button data-view="saved" aria-pressed="false">Guardados</button>
        <button data-view="taste" aria-pressed="false">Mis gustos</button>
      </div>
    </div>
    <div class="sub" id="feedControls">
      <select id="daySel" aria-label="Día"></select>
      <button class="order" id="orderBtn" aria-pressed="false">Orden: variado</button>
    </div>
    <div class="chips" id="chips" role="group" aria-label="Filtrar por tema"></div>
  </header>
  <main id="main">
    <div class="empty"><h3>Cargando noticias…</h3></div>
  </main>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</div>

<script>
const CATS = {
  ciencia:{name:"Ciencia"}, ia:{name:"IA"}, tecnologia:{name:"Tecnología"},
  medicina:{name:"Medicina"}, nutricion:{name:"Nutrición", light:true},
  historia:{name:"Historia"}, economia:{name:"Economía"}
};
const ICON = {
  like:'<svg class="fillable" viewBox="0 0 24 24"><path d="M12 20s-7-4.4-9.2-9A5 5 0 0 1 12 6a5 5 0 0 1 9.2 5C19 15.6 12 20 12 20z"/></svg>',
  save:'<svg class="fillable" viewBox="0 0 24 24"><path d="M6 3h12v18l-6-4-6 4z"/></svg>',
  skip:'<svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  share:'<svg viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg>'
};

const S = {
  days:[], dayDocs:{}, day:null, view:"feed", cat:"all", smart:false,
  r:{},            // reacciones: id -> {l,s,x,v,c,t,snap}
  db:null, uid:null, ref:null, persist:"none",
  activeIdx:0, dwellStart:0, loading:true
};

/* ---------- persistencia ---------- */
// Tus reacciones se guardan en este navegador. Si existe api/prefs.php en el servidor,
// se envía además un resumen para que el script diario personalice la selección.
let saveTimer=null, syncing=false, dirty=false, syncOK=true;
function lsGet(){ try{ return JSON.parse(localStorage.getItem("chispa-r")||"{}") }catch(e){ return {} } }
function lsSet(){ try{ localStorage.setItem("chispa-r", JSON.stringify(S.r)) }catch(e){} }
function queueSave(){ lsSet(); dirty=true; clearTimeout(saveTimer); saveTimer=setTimeout(flush,2500); }
function prefsPayload(){
  const recent=Object.entries(S.r).filter(([,x])=>x.l||x.s||x.x||(x.v||0)>=8)
    .sort((a,b)=>(b[1].t||0)-(a[1].t||0)).slice(0,200)
    .map(([id,x])=>({id,c:x.c,l:x.l?1:0,s:x.s?1:0,x:x.x?1:0,v:x.v||0,title:(findItem(id)||x.snap||{}).title||""}));
  return {updatedAt:new Date().toISOString(), weights:catWeights(), recent};
}
async function flush(){
  if(!syncOK || syncing || !dirty) return;
  syncing=true; dirty=false;
  try{
    const res=await fetch("api/prefs.php",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(prefsPayload())});
    if(!res.ok || !(res.headers.get("content-type")||"").includes("json")) syncOK=false;
  }catch(e){ syncOK=false; }
  syncing=false;
  if(dirty) saveTimer=setTimeout(flush,5000);
}

/* ---------- utilidades ---------- */
const $ = s=>document.querySelector(s);
const esc = s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function toast(msg){ const t=$("#toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove("show"),1600); }
function catColor(c){ return `var(--${CATS[c]?c:"ciencia"})`; }
function fmtDate(d){ const [m,day]=String(d||"").split("-"); return day?`${+day}/${+m}`:""; }

function interleave(items){
  const by={}; items.forEach(it=>(by[it.cat]=by[it.cat]||[]).push(it));
  const keys=Object.keys(by), out=[]; let i=0;
  while(out.length<items.length){ const k=keys[i%keys.length]; if(by[k].length) out.push(by[k].shift()); i++; }
  return out;
}
function catWeights(){
  const w={}; Object.keys(CATS).forEach(c=>w[c]=0);
  Object.values(S.r).forEach(x=>{ if(!x.c||w[x.c]===undefined) return;
    w[x.c]+= (x.l?2:0)+(x.s?3:0)-(x.x?3:0)+((x.v||0)>=8?1:0); });
  return w;
}
function reactionCount(){ return Object.values(S.r).filter(x=>x.l||x.s||x.x).length; }

function currentItems(){
  const doc=S.dayDocs[S.day]; if(!doc) return [];
  let items=(doc.items||[]).filter(it=>S.cat==="all"||it.cat===S.cat);
  items=interleave(items);
  if(S.smart){
    const w=catWeights();
    items=items.map((it,i)=>({it,i,score:w[it.cat]*10 - i*0.5 - (S.r[it.id]?.x?1000:0)}))
               .sort((a,b)=>b.score-a.score).map(o=>o.it);
  }
  return items;
}

/* ---------- render ---------- */
function renderChips(){
  const el=$("#chips");
  const counts={}; (S.dayDocs[S.day]?.items||[]).forEach(it=>counts[it.cat]=(counts[it.cat]||0)+1);
  el.innerHTML=`<button class="chip" data-cat="all" aria-pressed="${S.cat==="all"}">Todo</button>`+
    Object.entries(CATS).filter(([k])=>counts[k]).map(([k,v])=>
      `<button class="chip" data-cat="${k}" aria-pressed="${S.cat===k}"><i style="background:${catColor(k)}"></i>${v.name}</button>`).join("");
}
function renderDays(){
  const sel=$("#daySel");
  sel.innerHTML=S.days.map(d=>`<option value="${esc(d.date)}" ${d.date===S.day?"selected":""}>${esc(d.label||d.date)} (${(d.items||[]).length})</option>`).join("");
  $("#dayLabel").textContent = S.day ? `${(S.dayDocs[S.day]?.items||[]).length}` : "";
}
function renderOrder(){
  const b=$("#orderBtn"); b.setAttribute("aria-pressed",S.smart);
  b.textContent = S.smart ? "Orden: para ti" : "Orden: variado";
}

function cardHTML(it,idx,total){
  const r=S.r[it.id]||{}, light=CATS[it.cat]?.light;
  const extra=(it.extra||[]).map(x=>`<a href="${esc(x.url)}" target="_blank" rel="noopener">${esc(x.label)}</a>`).join("");
  const gnews=`https://news.google.com/search?q=${encodeURIComponent(it.title)}&hl=es&gl=ES&ceid=ES:es`;
  return `<section class="card ${light?"light":""} ${it.hook?"":"nohook"}" style="--c:${catColor(it.cat)}" data-id="${esc(it.id)}" data-idx="${idx}" aria-label="${esc(it.title)}">
    <div class="counter"><i style="width:${((idx+1)/total*100).toFixed(1)}%"></i></div>
    <div class="body">
      <div class="meta"><span class="cat">${esc(CATS[it.cat]?.name||it.cat)}</span><span class="src">${esc(it.source)}</span><span class="when">${fmtDate(it.date)}</span></div>
      ${it.hook?`<div class="hook"><b>${esc(it.hook)}</b><span>${esc(it.hookLabel||"")}</span></div>`:""}
      <h2>${esc(it.title)}</h2>
      <p class="idea">${esc(it.idea)}</p>
      <p class="concl">${esc(it.conclusion)}</p>
      <div class="links">
        <a class="main" href="${esc(it.url)}" target="_blank" rel="noopener">Leer en ${esc(it.source)}<span class="lang">${it.lang==="es"?"ES":"EN"}</span></a>
        ${extra}
        <a href="${gnews}" target="_blank" rel="noopener">Buscar más</a>
      </div>
    </div>
    <div class="rail">
      <button class="act" data-act="l" aria-pressed="${!!r.l}" aria-label="Me gusta">${ICON.like}</button>
      <button class="act" data-act="s" aria-pressed="${!!r.s}" aria-label="Guardar">${ICON.save}</button>
      <button class="act" data-act="x" aria-pressed="${!!r.x}" aria-label="No me interesa">${ICON.skip}</button>
      <button class="act" data-act="share" aria-label="Compartir">${ICON.share}</button>
    </div>
    <div class="burst" aria-hidden="true">${ICON.like.replace('class="fillable" ','')}</div>
  </section>`;
}

let io=null;
function renderFeed(keepId){
  const main=$("#main");
  if(S.loading){ main.innerHTML=`<div class="empty"><h3>Cargando noticias…</h3></div>`; return; }

  const items=currentItems();
  if(!S.days.length){
    main.innerHTML=`<div class="empty"><h3>Aún no hay noticias</h3><p>Todavía no se ha generado ningún día. Ejecuta el script de actualización o sube un archivo a la carpeta <code>feeds</code>.</p></div>`; return;
  }
  if(!items.length){
    main.innerHTML=`<div class="empty"><h3>Nada en este tema hoy</h3><p>Prueba con <code>Todo</code> u otro día.</p></div>`; return;
  }
  main.innerHTML=`<div class="feed" id="feed" tabindex="0">${items.map((it,i)=>cardHTML(it,i,items.length)).join("")}</div>`;
  const feed=$("#feed");
  if(io) io.disconnect();
  io=new IntersectionObserver(es=>{
    es.forEach(e=>{ if(e.isIntersecting && e.intersectionRatio>.6){ onActive(+e.target.dataset.idx, e.target.dataset.id); } });
  },{root:feed,threshold:[.6]});
  feed.querySelectorAll(".card").forEach(c=>io.observe(c));
  if(keepId){ const c=feed.querySelector(`.card[data-id="${CSS.escape(keepId)}"]`); if(c) feed.scrollTop=c.offsetTop; }
}
let activeId=null;
function onActive(idx,id){
  endDwell();
  S.activeIdx=idx; activeId=id; S.dwellStart=Date.now();
}
function endDwell(){
  if(!activeId||!S.dwellStart) return;
  const secs=Math.round((Date.now()-S.dwellStart)/1000); S.dwellStart=0;
  if(secs<3) return;
  const it=findItem(activeId); const r=S.r[activeId]||(S.r[activeId]={});
  const nv=Math.min(600,Math.max(r.v||0,secs));
  if(nv!==r.v){ r.v=nv; r.c=it?.cat||r.c; r.t=Date.now(); r.d=S.day; queueSave(); }
}
function findItem(id){ for(const d of Object.values(S.dayDocs)){ const f=(d.items||[]).find(x=>x&&x.id===id); if(f) return f; } return null; }

function renderSaved(){
  const list=Object.entries(S.r).filter(([,x])=>x.s&&x.snap).sort((a,b)=>(b[1].t||0)-(a[1].t||0));
  $("#main").innerHTML=`<div class="panel"><h3>Guardados</h3><p class="lead">${list.length?`${list.length} historias para volver a ellas.`:"Pulsa el marcador en cualquier historia para guardarla aquí."}</p>
   <div class="saved">${list.map(([id,x])=>`<article style="--c:${catColor(x.c)}"><i></i><div><h4>${esc(x.snap.title)}</h4><div class="s-meta">${esc(CATS[x.c]?.name||"")}, ${esc(x.snap.source)}, ${fmtDate(x.snap.date)}</div><a href="${esc(x.snap.url)}" target="_blank" rel="noopener">Leer en ${esc(x.snap.source)}</a></div><button data-unsave="${esc(id)}">Quitar</button></article>`).join("")}</div></div>`;
}
function renderTaste(){
  const agg={}; Object.keys(CATS).forEach(c=>agg[c]={l:0,s:0,x:0});
  Object.values(S.r).forEach(x=>{ if(agg[x.c]){ if(x.l)agg[x.c].l++; if(x.s)agg[x.c].s++; if(x.x)agg[x.c].x++; }});
  const w=catWeights(); const max=Math.max(1,...Object.values(w).map(v=>Math.max(0,v)));
  const likes=Object.values(S.r).filter(x=>x.l).length, saves=Object.values(S.r).filter(x=>x.s).length, skips=Object.values(S.r).filter(x=>x.x).length;
  const rows=Object.entries(CATS).sort((a,b)=>w[b[0]]-w[a[0]]).map(([k,v])=>
    `<div class="bar" style="--c:${catColor(k)}"><span>${v.name}</span><div class="track"><div class="fill" style="width:${Math.max(0,w[k])/max*100}%"></div></div><span class="num">♥${agg[k].l} ★${agg[k].s} ✕${agg[k].x}</span></div>`).join("");
  $("#main").innerHTML=`<div class="panel"><h3>Mis gustos</h3><p class="lead">Así se reparte tu interés. Se usa para elegir las noticias de los próximos días.</p>
   <div class="stats"><div><b>${likes}</b><span>me gusta</span></div><div><b>${saves}</b><span>guardadas</span></div><div><b>${skips}</b><span>descartadas</span></div></div>
   <div class="bars">${rows}</div>
   <p class="note">Cuenta: me gusta +2, guardar +3, descartar −3 y leer más de 8 segundos +1. Atajos de teclado: ↓/j siguiente, ↑/k anterior, l me gusta, s guardar, x descartar.</p></div>`;
}
function render(keepId){
  document.querySelectorAll(".tabs button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.view===S.view));
  $("#feedControls").style.display = S.view==="feed"?"flex":"none";
  $("#chips").style.display = S.view==="feed"?"flex":"none";
  renderDays(); renderChips(); renderOrder();
  if(S.view==="feed") renderFeed(keepId); else if(S.view==="saved") renderSaved(); else renderTaste();
}

/* ---------- acciones ---------- */
function react(id,act,card){
  const it=findItem(id); if(!it) return;
  const r=S.r[id]||(S.r[id]={});
  r[act]=r[act]?0:1;
  if(act==="l"&&r.l) r.x=0;
  if(act==="x"&&r.x) r.l=0;
  r.c=it.cat; r.t=Date.now(); r.d=S.day;
  if(r.s) r.snap={title:it.title,url:it.url,source:it.source,date:it.date}; else delete r.snap;
  queueSave();
  if(card){
    card.querySelectorAll(".act[data-act]").forEach(b=>{ const a=b.dataset.act; if(a!=="share") b.setAttribute("aria-pressed",!!r[a]); });
    if(act==="l"&&r.l){ const bu=card.querySelector(".burst"); bu.classList.remove("go"); void bu.offsetWidth; bu.classList.add("go"); }
    if(act==="s") toast(r.s?"Guardada":"Quitada de guardados");
    if(act==="x"&&r.x){ toast("Verás menos de esto"); setTimeout(()=>step(1),350); }
  }
}
function step(d){
  const feed=$("#feed"); if(!feed) return;
  const cards=feed.querySelectorAll(".card"); const n=Math.max(0,Math.min(cards.length-1,S.activeIdx+d));
  cards[n]?.scrollIntoView({behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth"});
}
async function share(it){
  const data={title:it.title,text:it.conclusion,url:it.url};
  try{ if(navigator.share){ await navigator.share(data); return; } }catch(e){ return; }
  try{ await navigator.clipboard.writeText(`${it.title}\n${it.url}`); toast("Enlace copiado"); }catch(e){ toast("No se pudo copiar el enlace"); }
}

document.addEventListener("click",e=>{
  const tab=e.target.closest(".tabs button"); if(tab){ endDwell(); S.view=tab.dataset.view; render(); return; }
  const chip=e.target.closest(".chip"); if(chip){ S.cat=chip.dataset.cat; render(); return; }
  if(e.target.closest("#orderBtn")){ S.smart=!S.smart; if(S.smart&&reactionCount()<3) toast("Reacciona a unas cuantas para afinar el orden"); render(); return; }
  const un=e.target.closest("[data-unsave]"); if(un){ const r=S.r[un.dataset.unsave]; if(r){ r.s=0; delete r.snap; queueSave(); renderSaved(); } return; }
  const act=e.target.closest(".act"); if(act){ const card=act.closest(".card"); const id=card.dataset.id;
    if(act.dataset.act==="share"){ const it=findItem(id); if(it) share(it); } else react(id,act.dataset.act,card); }
});
let lastTap=0;
document.addEventListener("pointerup",e=>{
  const card=e.target.closest(".card"); if(!card||e.target.closest("a,button")) return;
  const now=Date.now(); if(now-lastTap<300){ const r=S.r[card.dataset.id]; if(!r||!r.l) react(card.dataset.id,"l",card); lastTap=0; } else lastTap=now;
});
document.addEventListener("keydown",e=>{
  if(S.view!=="feed"||e.target.matches("select,input,textarea")) return;
  const card=document.querySelector(`.card[data-idx="${S.activeIdx}"]`);
  if(e.key==="ArrowDown"||e.key==="j"){ e.preventDefault(); step(1); }
  else if(e.key==="ArrowUp"||e.key==="k"){ e.preventDefault(); step(-1); }
  else if(card&&(e.key==="l"||e.key==="s"||e.key==="x")) react(card.dataset.id,e.key,card);
});
$("#daySel").addEventListener("change",e=>{ endDwell(); S.cat="all"; selectDay(e.target.value); });
document.addEventListener("visibilitychange",()=>{ if(document.hidden){ endDwell(); flush(); } else if(activeId){ S.dwellStart=Date.now(); } });

/* ---------- arranque ---------- */
async function getJSON(u){ const r=await fetch(u,{cache:"no-cache"}); if(!r.ok) throw new Error(r.status); return r.json(); }
async function loadDay(date){
  if(!S.dayDocs[date] || !S.dayDocs[date].items){
    const doc=await getJSON(`feeds/${date}.json`);
    S.dayDocs[date]=doc;
    const d=S.days.find(x=>x.date===date); if(d) d.items=doc.items;
  }
}
async function selectDay(date){
  S.day=date; S.loading=true; render();
  try{ await loadDay(date); S.loading=false; render(); }
  catch(e){ S.loading=false; $("#main").innerHTML=`<div class="empty"><h3>No se pudo cargar ese día</h3><p>Falta el archivo <code>feeds/${esc(date)}.json</code> en el servidor.</p></div>`; }
}
S.r=lsGet();
render();
(async()=>{
  try{
    const idx=await getJSON("feeds/index.json");
    S.days=(idx.days||[]).map(d=>({date:d.date,label:d.label,items:new Array(d.count||0)}));
    S.dayDocs={};
    if(!S.days.length){ S.loading=false; render(); return; }
    await selectDay(S.days[0].date);
  }catch(e){
    S.loading=false;
    $("#main").innerHTML=`<div class="empty"><h3>No se encontraron las noticias</h3><p>La página busca <code>feeds/index.json</code> junto a este archivo. Si lo abres directamente desde el disco, el navegador bloquea la carga: súbelo a tu servidor o usa un servidor local.</p></div>`;
  }
})();
</script>
</body>
</html>
